when:
  - event: ["pull_request"]
    branch: ["main"]
engine: "nixery"
dependencies:
  nixpkgs:
    - nodejs
steps:
  - name: "Install dependencies"
    command: "npm ci"
  - name: "Build"
    command: "npm run build"
    environment:
      NODE_ENV: "production"
  - name: "Login to Cloudflare"
    command: "npx wrangler login"
  - name: "Deploy"
    command: "npx wrangler versions upload --preview-alias staging"
